<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin - GitHub Patcher</title>
    <style>
        :root {
            --primary: #f8fafc;
            --accent: #3b82f6;
            --ai-color: #8b5cf6;
            --bg: #111827;
            --panel-bg: #1f2937;
            --border: #374151;
            --text: #f3f4f6;
            --success: #16a34a;
            --danger: #ef4444;
        }

        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 20px; 
            margin: 0; 
        }

        .container { max-width: 800px; margin: 0 auto; }

        .header { 
            text-align: center; 
            padding-bottom: 20px; 
            margin-bottom: 20px; 
            border-bottom: 2px solid var(--border); 
        }
        
        .header h1 { margin: 0; color: var(--primary); font-size: 24px; text-transform: uppercase; }
        .header p { margin: 5px 0 0 0; color: #9ca3af; font-size: 13px; }

        .panel {
            background: var(--panel-bg); 
            padding: 20px; 
            border-radius: 12px;
            margin-bottom: 20px; 
            border: 1px solid var(--accent); 
            box-shadow: 0 6px 18px rgba(0,0,0,0.4);
        }

        label { font-size: 13px; color: #9ca3af; font-weight: bold; display: block; margin-bottom: 6px; margin-top: 12px; }
        
        textarea, input {
            width: 100%; 
            padding: 12px; 
            background: #111827; 
            color: #fff; 
            border: 1px solid var(--border);
            border-radius: 8px; 
            font-family: monospace; 
            font-size: 13px;
            box-sizing: border-box;
        }
        
        textarea { resize: vertical; }
        textarea:focus, input:focus { border-color: var(--accent); outline: none; }

        .btn { 
            padding: 14px 20px; 
            border: none; 
            border-radius: 8px; 
            font-size: 14px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s; 
            display: inline-block;
            width: 100%;
            margin-top: 15px;
        }
        
        .btn-save { background-color: var(--success); color: white; }
        .btn-save:hover { background-color: #15803d; }
        .btn-save:disabled { background-color: #374151; color: #9ca3af; cursor: not-allowed; }

        .status { 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 13px; 
            font-weight: bold; 
            text-align: center; 
            display: none; 
            margin-bottom: 15px;
        }
        .status.success { background-color: #14532d; color: #dcfce7; border: 1px solid #15803d; display: block; }
        .status.error { background-color: #7f1d1d; color: #fca5a5; border: 1px solid #ef4444; display: block; }
        .status.loading { background-color: #1e3a8a; color: #bfdbfe; border: 1px solid #3b82f6; display: block; }

        .two-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Master Admin - GitHub Patcher</h1>
        <p>Actualizare parțială de cod direct pe repository (fără a suprascrie întregul fișier)</p>
    </div>

    <div id="statusBox" class="status"></div>

    <div class="panel" style="border-color: var(--ai-color);">
        <h3 style="color: var(--ai-color); margin-top: 0;">1. Configurare Conexiune API</h3>
        <label>🔑 Token Access GitHub (ghp_...):</label>
        <input type="password" id="ghToken" placeholder="Introdu token-ul tău GitHub Personal Access">
        
        <div class="two-cols">
            <div>
                <label>📂 Repository:</label>
                <input type="text" id="ghRepo" value="mateiantonio28-sketch/LaCentral">
            </div>
            <div>
                <label>📄 Fișier țintă:</label>
                <input type="text" id="ghFile" value="index.html">
            </div>
        </div>
    </div>

    <div class="panel">
        <h3 style="color: var(--accent); margin-top: 0;">2. Editare Parțială Cod</h3>
        <label>🔍 Codul existent pe care vrei să-l înlocuiești (Fii foarte exact):</label>
        <textarea id="searchCode" rows="4" placeholder='ex: const CURRENT_APP_VERSION = "v1.18";'></textarea>

        <label>✍️ Noul cod (Cu ce îl înlocuiești):</label>
        <textarea id="replaceCode" rows="4" placeholder='ex: const CURRENT_APP_VERSION = "v1.19";'></textarea>

        <label>📝 Mesaj Commit (Opțional):</label>
        <input type="text" id="commitMessage" value="Update parțial din panoul de administrare">

        <button class="btn btn-save" onclick="applyGithubPatch()" id="btnApply">🚀 Aplică & Trimite către GitHub</button>
    </div>
</div>

<script>
    // Salvăm și încărcăm token-ul local pentru a nu-l introduce de fiecare dată
    document.addEventListener("DOMContentLoaded", () => {
        const savedToken = localStorage.getItem('admin_github_patch_token');
        if (savedToken) document.getElementById('ghToken').value = savedToken;
    });

    async function applyGithubPatch() {
        const token = document.getElementById('ghToken').value.trim();
        const repo = document.getElementById('ghRepo').value.trim();
        const filePath = document.getElementById('ghFile').value.trim();
        const searchStr = document.getElementById('searchCode').value;
        const replaceStr = document.getElementById('replaceCode').value;
        const commitMsg = document.getElementById('commitMessage').value.trim();

        if (!token || !repo || !filePath || !searchStr) {
            showStatus('Eroare: Toate câmpurile (în afară de codul nou) sunt obligatorii!', 'error');
            return;
        }

        // Salvăm token-ul pentru sesiunile viitoare
        localStorage.setItem('admin_github_patch_token', token);

        const btn = document.getElementById('btnApply');
        btn.disabled = true;
        showStatus('⏳ 1/3 Se descarcă fișierul curent de pe GitHub...', 'loading');

        try {
            const apiUrl = `https://api.github.com/repos/${repo}/contents/${filePath}`;
            
            // 1. Preluăm fișierul curent pentru a obține conținutul și cheia SHA
            const getRes = await fetch(apiUrl, {
                headers: { "Authorization": `token ${token}` }
            });

            if (!getRes.ok) throw new Error("Nu s-a putut accesa fișierul. Verifică Token-ul și numele Repository-ului.");
            
            const fileData = await getRes.json();
            
            // 2. Decodăm fișierul din Base64 (suport pentru caractere speciale / accente franceze)
            const currentContentDecoded = decodeURIComponent(escape(atob(fileData.content)));

            // 3. Verificăm dacă secțiunea căutată există
            if (!currentContentDecoded.includes(searchStr)) {
                throw new Error("Codul pe care vrei să-l înlocuiești nu a fost găsit în fișier. Verifică spațiile și formatarea!");
            }

            showStatus('⚙️ 2/3 Se aplică modificarea parțială...', 'loading');

            // 4. Efectuăm înlocuirea
            const newContentStr = currentContentDecoded.replace(searchStr, replaceStr);

            // 5. Re-codăm în Base64 (suport pentru caractere speciale)
            const newContentBase64 = btoa(unescape(encodeURIComponent(newContentStr)));

            showStatus('🚀 3/3 Se trimite update-ul către GitHub...', 'loading');

            // 6. Trimitem update-ul (PUT request)
            const putRes = await fetch(apiUrl, {
                method: "PUT",
                headers: { 
                    "Authorization": `token ${token}`,
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify({
                    message: commitMsg,
                    content: newContentBase64,
                    sha: fileData.sha // Obligatoriu pentru a putea face update
                })
            });

            if (!putRes.ok) throw new Error("Eroare la salvarea pe GitHub. Posibil conflict de versiune.");

            showStatus('✅ Update realizat cu succes! Aplicația a fost actualizată pe GitHub.', 'success');
            
            // Curățăm câmpurile de editare după succes
            document.getElementById('searchCode').value = '';
            document.getElementById('replaceCode').value = '';

        } catch (error) {
            console.error(error);
            showStatus(`❌ ${error.message}`, 'error');
        } finally {
            btn.disabled = false;
        }
    }

    function showStatus(message, type) {
        const box = document.getElementById('statusBox');
        box.textContent = message;
        box.className = `status ${type}`;
    }
</script>

</body>
</html>
